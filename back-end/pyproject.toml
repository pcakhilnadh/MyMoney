[project]
name = "back-end"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.151.0",
    "google-auth>=2.62.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
